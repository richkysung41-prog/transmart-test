<!DOCTYPE html>
<html>
<head>
    <title>Test Register</title>
</head>
<body>
    <h1>Test Register Form</h1>
    <form id="testForm">
        <input type="text" id="name" name="name" value="Test User" />
        <input type="email" id="email" name="email" value="testform@example.com" />
        <input type="tel" id="phone" name="phone" value="081234567890" />
        <input type="password" id="password" name="password" value="Test123" />
        <button type="submit">Submit</button>
    </form>

    <script>
        console.log('Test page loaded');
        
        document.getElementById('testForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            console.log('Form submitted');
            
            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: document.getElementById('password').value
            };
            
            console.log('Sending data:', data);
            
            try {
                const response = await fetch('/api/auth.php?action=register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                console.log('Response status:', response.status);
                const result = await response.json();
                console.log('Result:', result);
                
                alert(JSON.stringify(result, null, 2));
            } catch (error) {
                console.error('Error:', error);
                alert('Error: ' + error.message);
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Debug Register</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        form { border: 1px solid #ccc; padding: 20px; max-width: 400px; }
        input, button { display: block; margin: 10px 0; width: 100%; padding: 8px; }
        .log { border: 1px solid #ddd; padding: 10px; margin-top: 20px; height: 300px; overflow-y: auto; background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>Debug Register Form</h1>
    
    <form id="registerForm">
        <input type="text" id="name" placeholder="Nama" value="Test Nama" required>
        <input type="email" id="email" placeholder="Email" value="debugtest@example.com" required>
        <input type="tel" id="phone" placeholder="Phone" value="081111111" required>
        <input type="password" id="password" placeholder="Password" value="Test123" required>
        <input type="password" id="confirmPassword" placeholder="Konfirmasi Password" value="Test123" required>
        <input type="checkbox" id="terms" checked> Setuju T&K
        <button type="submit">Register</button>
    </form>

    <div class="log" id="log"></div>

    <script>
        function log(msg) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${timestamp}] ${msg}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        log('Page loaded');

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            log('✓ Form submit event triggered');
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            
            log(`Sending: ${name}, ${email}, ${phone}, ${password}`);
            
            try {
                log('Calling API: /api/auth.php?action=register');
                const response = await fetch('/api/auth.php?action=register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        phone: phone,
                        password: password
                    })
                });
                
                log(`API Response Status: ${response.status}`);
                const result = await response.json();
                log(`API Result: ${JSON.stringify(result)}`);
                
                if (result.success) {
                    log('✓ SUCCESS! User registered.');
                } else {
                    log(`✗ ERROR: ${result.error}`);
                }
            } catch (error) {
                log(`✗ EXCEPTION: ${error.message}`);
            }
        });
        
        log('Event listener attached');
    </script>
</body>
</html>

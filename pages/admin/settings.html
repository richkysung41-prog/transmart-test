<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan - Admin Transmart</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-4">
                    <a href="dashboard.html" class="flex items-center space-x-2">
                        <div class="w-8 h-8 bg-gray-200 rounded-lg flex items-center justify-center">
                            <i class="fas fa-shopping-bag text-lg transmart-red"></i>
                        </div>
                        <span class="text-xl font-bold text-gray-900">Transmart</span>
                        <span class="px-2 py-1 bg-transmart-red text-white text-xs rounded-full ml-2">Admin</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="text-sm text-gray-600">
                        <i class="fas fa-user-circle mr-1"></i>
                        <span id="adminName">Admin User</span>
                    </div>
                    <button onclick="logout()" class="text-gray-600 hover:text-gray-900">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex h-screen pt-16">
        <!-- Sidebar -->
        <aside class="w-64 bg-white shadow-sm border-r h-full fixed overflow-y-auto">
            <nav class="p-4 space-y-2">
                <a href="dashboard.html" class="flex items-center space-x-3 p-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <i class="fas fa-chart-bar"></i>
                    <span>Dashboard</span>
                </a>
                <a href="products.html" class="flex items-center space-x-3 p-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <i class="fas fa-box"></i>
                    <span>Produk</span>
                </a>
                <a href="categories.html" class="flex items-center space-x-3 p-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <i class="fas fa-tags"></i>
                    <span>Kategori</span>
                </a>
                <a href="orders.html" class="flex items-center space-x-3 p-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Pesanan</span>
                </a>
                <a href="customers.html" class="flex items-center space-x-3 p-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <i class="fas fa-users"></i>
                    <span>Pelanggan</span>
                </a>
                <a href="promo.html" class="flex items-center space-x-3 p-3 text-gray-700 hover:bg-gray-100 rounded-lg">
                    <i class="fas fa-percent"></i>
                    <span>Promo</span>
                </a>
                <a href="settings.html" class="flex items-center space-x-3 p-3 bg-transmart-red text-white rounded-lg">
                    <i class="fas fa-cog"></i>
                    <span>Pengaturan</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 ml-64 p-6 overflow-y-auto">
            <!-- Page Header -->
            <div class="mb-6">
                <h1 class="text-2xl font-bold text-gray-900">Pengaturan Sistem</h1>
                <p class="text-gray-600">Kelola konfigurasi dan pengaturan toko Anda</p>
            </div>

            <!-- Settings Tabs -->
            <div class="bg-white rounded-lg shadow-sm border mb-6">
                <div class="flex border-b">
                    <button onclick="switchTab('general')" class="settings-tab px-6 py-4 font-medium text-gray-700 border-b-2 border-transparent hover:border-transmart-red active" data-tab="general">
                        <i class="fas fa-cog mr-2"></i>Umum
                    </button>
                    <button onclick="switchTab('store')" class="settings-tab px-6 py-4 font-medium text-gray-700 border-b-2 border-transparent hover:border-transmart-red" data-tab="store">
                        <i class="fas fa-store mr-2"></i>Toko
                    </button>
                    <button onclick="switchTab('payment')" class="settings-tab px-6 py-4 font-medium text-gray-700 border-b-2 border-transparent hover:border-transmart-red" data-tab="payment">
                        <i class="fas fa-credit-card mr-2"></i>Pembayaran
                    </button>
                    <button onclick="switchTab('email')" class="settings-tab px-6 py-4 font-medium text-gray-700 border-b-2 border-transparent hover:border-transmart-red" data-tab="email">
                        <i class="fas fa-envelope mr-2"></i>Email
                    </button>
                </div>
            </div>

            <!-- General Settings -->
            <div id="general-tab" class="settings-content">
                <div class="bg-white rounded-lg shadow-sm border p-6 mb-6">
                    <h2 class="text-lg font-semibold mb-4">Pengaturan Umum</h2>
                    <form class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Toko</label>
                            <input type="text" value="Transmart" 
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-transmart-red">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Deskripsi Toko</label>
                            <textarea rows="3" 
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-transmart-red">Platform e-commerce terpercaya untuk berbagai kebutuhan Anda</textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Email Toko</label>
                            <input type="email" value="info@transmart.com" 
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-transmart-red">
                        </div>
                        <button type="button" onclick="saveSettings('general')" class="px-6 py-2 bg-transmart-red text-white rounded-lg hover:bg-red-700">
                            Simpan Perubahan
                        </button>
                    </form>
                </div>
            </div>

            <!-- Store Settings -->
            <div id="store-tab" class="settings-content hidden">
                <div class="bg-white rounded-lg shadow-sm border p-6 mb-6">
                    <h2 class="text-lg font-semibold mb-4">Pengaturan Toko</h2>
                    <form class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Alamat Toko</label>
                                <input type="text" value="Jakarta, Indonesia" 
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-transmart-red">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Telepon Toko</label>
                                <input type="tel" value="(021) 1234-5678" 
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-transmart-red">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Jam Operasional</label>
                            <input type="text" value="Senin - Jumat: 08:00 - 17:00 | Sabtu: 08:00 - 13:00 | Minggu: Tutup" 
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-transmart-red">
                        </div>
                        <button type="button" onclick="saveSettings('store')" class="px-6 py-2 bg-transmart-red text-white rounded-lg hover:bg-red-700">
                            Simpan Perubahan
                        </button>
                    </form>
                </div>
            </div>

            <!-- Payment Settings -->
            <div id="payment-tab" class="settings-content hidden">
                <div class="bg-white rounded-lg shadow-sm border p-6 mb-6">
                    <h2 class="text-lg font-semibold mb-4">Pengaturan Pembayaran</h2>
                    <form class="space-y-4">
                        <div class="space-y-3">
                            <label class="flex items-center">
                                <input type="checkbox" checked class="w-4 h-4 text-transmart-red rounded">
                                <span class="ml-2 text-sm font-medium text-gray-700">Transfer Bank</span>
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" checked class="w-4 h-4 text-transmart-red rounded">
                                <span class="ml-2 text-sm font-medium text-gray-700">E-Wallet</span>
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" class="w-4 h-4 text-transmart-red rounded">
                                <span class="ml-2 text-sm font-medium text-gray-700">Cicilan</span>
                            </label>
                        </div>
                        <button type="button" onclick="saveSettings('payment')" class="px-6 py-2 bg-transmart-red text-white rounded-lg hover:bg-red-700">
                            Simpan Perubahan
                        </button>
                    </form>
                </div>
            </div>

            <!-- Email Settings -->
            <div id="email-tab" class="settings-content hidden">
                <div class="bg-white rounded-lg shadow-sm border p-6 mb-6">
                    <h2 class="text-lg font-semibold mb-4">Pengaturan Email</h2>
                    <form class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">SMTP Server</label>
                            <input type="text" value="smtp.gmail.com" 
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-transmart-red">
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Port</label>
                                <input type="number" value="587" 
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-transmart-red">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                                <input type="email" value="info@transmart.com" 
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-transmart-red">
                            </div>
                        </div>
                        <button type="button" onclick="saveSettings('email')" class="px-6 py-2 bg-transmart-red text-white rounded-lg hover:bg-red-700">
                            Simpan Perubahan
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="../../assets/js/admin-settings.js"></script>
</body>
</html>
